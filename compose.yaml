services:
  mysql:
    image: 'mysql:8.4'
    environment:
      - 'MYSQL_DATABASE=main_project_backend'
      - 'MYSQL_USER=app'
      - 'MYSQL_PASSWORD=app'
      - 'MYSQL_ROOT_PASSWORD=root'
    ports:
      - '3306'
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-uroot', '-proot']
      interval: 5s
      timeout: 5s
      retries: 10
