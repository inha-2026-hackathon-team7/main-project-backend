spring.application.name=main-project-backend

# 로컬 기본값: compose.yaml 의 MySQL 컨테이너를 자동 기동하고, Spring Boot Docker Compose
# 연결정보 감지 기능이 datasource 를 자동 구성한다 (spring.datasource.* 를 여기서 지정하지 않는다).
# 배포 환경은 prod 프로파일에서 DB_URL/DB_USERNAME/DB_PASSWORD 로 명시 주입한다.
spring.docker.compose.enabled=true

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

# 로컬 개발 전용 기본값. 실제 배포에서는 반드시 JWT_SECRET 환경변수(최소 32바이트)로 덮어쓴다.
jwt.secret=${JWT_SECRET:local-development-only-secret-key-please-override}
jwt.expiration-seconds=3600

app.cors.allowed-origin=${FRONTEND_ORIGIN:http://localhost:5173}
